name: Deploy to GitHub Pages

# 画面に関係するものが変わったときだけ配信する。
on:
  push:
    branches: [claude/kondate-spec-phase-0-clu9o4]
    paths:
      - "app/**"
      - "lib/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # 手で押せる口も残す

# 連続 push で追い越しが起きないようにする。
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 型と Lint が通らないものは配らない。
      - run: npm run typecheck
      - run: npm run lint

      - name: Build static site
        env:
          # どちらも公開前提の値。世帯のデータを守るのは RLS（仕様書 3.3）。
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      # 置換が空振りしていないか確かめる。
      #
      # 単に "supabase.co" を探すだけでは駄目だった。supabase-js の
      # バンドルにこの文字列が元から入っており、Secrets 未設定でも
      # 素通りする（実際に初回の実行がそうなった）。
      # プロジェクト固有のホスト名と、鍵そのものが埋め込まれたかを見る。
      - name: Verify the build carries the Supabase settings
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "GitHub Secrets が設定されていません。"
            echo "Settings → Secrets and variables → Actions で次の2つを登録してください。"
            echo "  NEXT_PUBLIC_SUPABASE_URL"
            echo "  NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi

          host="${NEXT_PUBLIC_SUPABASE_URL#*://}"
          host="${host%%/*}"

          if ! grep -rqF "$host" out/; then
            echo "配信物に接続先（$host）が埋め込まれていません。"
            exit 1
          fi
          if ! grep -rqF "$NEXT_PUBLIC_SUPABASE_ANON_KEY" out/; then
            echo "配信物に ANON KEY が埋め込まれていません。"
            exit 1
          fi
          echo "接続先と鍵の埋め込みを確認しました。"

      # enablement: true にすると、Settings → Pages を手で開かなくても
      # 「GitHub Actions で配信する」設定を作ってくれる。
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
