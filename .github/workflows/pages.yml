name: Deploy to GitHub Pages

# 画面に関係するものが変わったときだけ配信する。
on:
  push:
    branches: [claude/kondate-spec-phase-0-clu9o4]
    paths:
      - "app/**"
      - "lib/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # 手で押せる口も残す

# 連続 push で追い越しが起きないようにする。
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 型と Lint が通らないものは配らない。
      - run: npm run typecheck
      - run: npm run lint

      - name: Build static site
        env:
          # どちらも公開前提の値。世帯のデータを守るのは RLS（仕様書 3.3）。
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      # 置換が空振りしていないか確かめる。
      # ここが無いと、設定漏れのまま配信してしまう。
      - name: Verify the build carries the Supabase URL
        run: |
          if ! grep -rq "supabase.co" out/; then
            echo "配信物に Supabase の接続先が含まれていません。"
            echo "GitHub Secrets の設定を確認してください。"
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
